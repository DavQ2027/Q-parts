        document.addEventListener('DOMContentLoaded', () => {
            const hamburgerBtn = document.getElementById('hamburgerBtn');

            const icon = hamburgerBtn.querySelector('i');

            hamburgerBtn.addEventListener('click', () => {
                navMenu.classList.toggle('active');
                if (navMenu.classList.contains('active')) {
                    icon.classList.remove('fa-bars');
                    icon.classList.add('fa-xmark');
                } else {
                    icon.classList.remove('fa-xmark');
                    icon.classList.add('fa-bars');
                }
            });
        });

    <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    updateProfile,
    updateEmail,
    signInWithPopup,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getDatabase, ref, set, get, update
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
   import Notiflix from 'https://cdn.jsdelivr.net/npm/notiflix@3/+esm'; 

  const firebaseConfig = {
    apiKey: "AIzaSyCN-IWtXu98vNOiCA9mZ6dAmksJTK2lRDA",
    authDomain: "sparepartsq-f5f03.firebaseapp.com",
    databaseURL: "https://sparepartsq-f5f03-default-rtdb.firebaseio.com",
    projectId: "sparepartsq-f5f03",
    storageBucket: "sparepartsq-f5f03.firebasestorage.app",
    messagingSenderId: "148056463900",
    appId: "1:148056463900:web:84c7a729ae6b2ba2031dd9",
    measurementId: "G-XB8Z574X6M"

  };


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const form = document.getElementById("perfilform");

    const nombreInput = document.getElementById("nombre");
    const duiInput = document.getElementById("DUI");
    const telefonoInput = document.getElementById("numero");
    const direccion = document.getElementById("direccion");
    const correoInput = document.getElementById("email");
    const registroInput = document.getElementById("Registro");
    const giroInput = document.getElementById("giro");
    const btnGuardar = document.getElementById("btnguardar");
    const mensaje = document.getElementById("mensaje");


    let usuarioActual = null;


    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        window.location.href = "login.html";
        return;
      }

      usuarioActual = user;

      try {

        
        const referenciaUsuario = ref(
          db,
          "usuarios/" + user.uid
        );

        const snapshot = await get(referenciaUsuario);

        if (snapshot.exists()) {

          const datos = snapshot.val();

          
          nombreInput.value = datos.nombre ?? "";
          duiInput.value = datos.dui ?? "";
          telefonoInput.value = datos.telefono ?? "";
          direccion.value = datos.direccion ?? "";
          correoInput.value = datos.correo ?? "";
          registroInput.value = datos.Registro ?? "";
          giroInput.value = datos.giro ?? "";

        } else {

          Notiflix.Notify.failure(
            "No se encontraron datos del perfil.");

        }

      } catch (error) {

        console.error(error);

     
         Notiflix.Notify.warning("Error al cargar los datos del perfil.");

      }

    });


  
    form.addEventListener("submit", async (e) => {

      e.preventDefault();

      if (!usuarioActual) {
       Notiflix.Notify.failure(
          "Debes iniciar sesión primero.");
        return;
      }

    
      const nombre = nombreInput.value.trim();
      const dui = duiInput.value.trim();
      const telefono = telefonoInput.value.trim();
      const correo = correoInput.value.trim();
      const Registro = registroInput.value.trim();
      const giro = giroInput.value.trim();
      const dire = direccion.value.trim();

      if (!nombre || !dui || !telefono || !correo|| !dire) {
        Notiflix.Notify.warning(
          "Completa los campos obligatorios.");
        return;
      }

      btnGuardar.disabled = true;
       Notiflix.Loading.standard();
       Notiflix.Loading.remove(1500);

      try {

       
        await updateProfile(usuarioActual, {
          displayName: nombre
        });

      
        const referenciaUsuario = ref(
          db,
          "usuarios/" + usuarioActual.uid
        );

        await update(referenciaUsuario, {
          nombre: nombre,
          dui: dui,
          telefono: telefono,
          correo: correo,
          Registro: Registro,
          direccion: dire,
          giro: giro,
          dire: direccion,
        });

     
        if (correo !== usuarioActual.email) {
          await updateEmail(usuarioActual, correo);
        }

         Notiflix.Notify.success("¡Perfil actualizado correctamente!");

      } catch (error) {

        console.error(error);

        if (error.code === "auth/requires-recent-login") {
          mensaje.textContent =
            "Por seguridad, vuelve a iniciar sesión para cambiar tu correo.";
        } else if (error.code === "auth/email-already-in-use") {
          mensaje.textContent =
            "Ese correo ya está registrado en otra cuenta.";
        } else if (error.code === "auth/invalid-email") {
          mensaje.textContent =
            "El correo electrónico no es válido.";
        } else {
          mensaje.textContent =
            "Ocurrió un error al actualizar el perfil.";
        }

      } finally {

        btnGuardar.disabled = false;

      }

    });

</script>
