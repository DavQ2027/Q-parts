<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="stylesheet" type="text/css" href="css/bootstrap.css">
	<title>Registrar</title>
  <link rel="icon" type="image/png" href="img/logoicon.png">

	<style>


		body{
			      margin: 0;
      background-color: #F7F8F9;
    }

		
		.formulario{
 
  height: 100%;
  display: flex;
  justify-content: center;
  margin-top: 32px;

}

form{
  
  width: 500px;
  height: 1035px;
  border-radius: 20px;
  background-color: white;
  display: flex;
  flex-direction: column;
  padding: 32px 48px;
  align-items: center;
  justify-content: center;
}

h2{
  
  font-size: 24px;
  color: black;
  margin-bottom: 16px;
}

.input-contenedor{
 
  width:100%;
  display: flex;
  flex-direction: column;
  gap:12px;
  margin-bottom: 16px;
}

.input-contenedor input{
  border: 1px solid #D0D0D0;
  height: 40px ;
  padding: 8px 16px;
  outline: none;
  border-radius: 7px;

}

.help-link{
  
  font-size: 13px;
  width: 100%;
  text-decoration: none;
  color: black;
  margin-bottom: 20px;
}

form .botoniniciarsesion{
  width: 100%;
  height: 45px;
  border-radius: 8px;
  background-color: #1F7EC0;
  font-weight: 600;
  color: white;
  font-family: 'Barlow', Arial, sans-serif ;
  cursor: pointer;
  font-size: 14px;
  margin-bottom: 18px;
  border: none;
}

.texto-separador{
  
  display: flex;
  align-items: center;
  justify-content: center;
  color: black ;
  font-size: 14px;
  margin-top: 2px;
  margin-bottom: 10px;

}

.texto-separador::before
.texto-separador::after{
  border-bottom: 2px solid black;
  width: 16px;
  margin: 0 0.6rem;
}

.autenticacion-opciones{
  
  display: flex;
  width: 100%;
  justify-content: center;
  margin-bottom: 19px;
  border-radius: 4px;
  background-color: white;
}

.autenticacion-opciones span{
  font-weight: 600;
  font-size: 14px;
}

.autenticacion-opciones{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 16px;
  border: 1px solid gray;
  cursor: pointer;
}

.formulario .autenticacion-opciones img{
  width: 18px;


}
	</style>
</head>
<body>


	    <div
      class="container-fluid"
    >
      <div class="col-10 offset-1">

        <div class="formulario">
          <form  method="GET" id="form">
          <h2>Registrarse</h2>
          <div class="input-contenedor">
            <label>Nombre</label>
          	<input type="text" placeholder="Nombre" id="Nombre" required>
            <label>DUI</label>
            <input  type="number" oninput="if(this.value.length > 9) this.value = this.value.slice(0, 9);"
  placeholder="12345678-9" id="dui" required 
>   
            <label>Direccion</label>
            <input type="text" placeholder="Direccion" id="Direccion" required>
            <label>Giro</label>
            <input type="text" placeholder="Giro" id="Giro" required> 
            <label>Registro Fiscal</label>
            <input type="number" oninput="if(this.value.length > 14) this.value = this.value.slice(0, 14);" placeholder="Registro Fiscal" id="Registro" required>
            <label>Numero</label>
            <input type="text" placeholder="Numero de Telefono" id="numeroT" required>
            <label>Email</label>
            <input type="text" placeholder="Hola@gmail.com" id="Email" required>
            <label>Contraseña</label>
            <input type="password" placeholder="Contraseña" id="Contraseña" required>
          </div>
          <a href="Inicio de sesion.html" class="help-link">¿Ya tienes una cuenta?</a>
          <button class="botoniniciarsesion" id="Iniciar" type="submit">Registrar</button>
          <div class="texto-separador"><span>O registrate con</span></div>
          <button class="autenticacion-opciones" id="Googleboton" type="submit">
            <img src="https://img.icons8.com/?size=100&id=17949&format=png&color=000000">
            <span>Google</span>
          </button>
          </form>
        </div>

      </div>

    </div>
    
  </div>




<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import {
    getAuth,
    createUserWithEmailAndPassword,
    updateProfile,
    GoogleAuthProvider,
    signInWithPopup
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import {
    getDatabase, ref, set, get
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
   import Notiflix from 'https://cdn.jsdelivr.net/npm/notiflix@3/+esm'; 

  const firebaseConfig = {
    apiKey: "AIzaSyCN-IWtXu98vNOiCA9mZ6dAmksJTK2lRDA",
    authDomain: "sparepartsq-f5f03.firebaseapp.com",
    databaseURL: "https://sparepartsq-f5f03-default-rtdb.firebaseio.com",
    projectId: "sparepartsq-f5f03",
    storageBucket: "sparepartsq-f5f03.firebasestorage.app",
    messagingSenderId: "148056463900",
    appId: "1:148056463900:web:84c7a729ae6b2ba2031dd9",
    measurementId: "G-XB8Z574X6M"

  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);
  const googleProvider = new GoogleAuthProvider();


  const btnRegistrar = document.getElementById("Iniciar");

  btnRegistrar.addEventListener("click", async (e) => {
    e.preventDefault(); 

    const nombre = document.getElementById("Nombre").value.trim();
    const dui = document.getElementById("dui").value.trim();
    const telefono = document.getElementById("numeroT").value.trim();
    const correo = document.getElementById("Email").value.trim();
    const giro = document.getElementById("Giro").value.trim();
    const Registro = document.getElementById("Registro").value.trim();
    const password = document.getElementById("Contraseña").value;

    if (!nombre || !dui || !telefono || !correo || !password || !Registro || !giro) {
      Notiflix.Notify.warning("Por favor completa todos los campos");
      return;
    }

    if (password.length < 6) {
      Notiflix.notify.warning('La contraseña debe contener al menos 6 caracteres');
      return;
    }

    try {
     
      const userCredential = await createUserWithEmailAndPassword(auth, correo, password);
      const user = userCredential.user;

      
      await updateProfile(user, { displayName: nombre });

      
      await set(ref(db, "usuarios/" + user.uid), {
        nombre,
        dui,
        telefono,
        correo,
        Registro,
        giro,
        metodoRegistro: "email",
        createdAt: new Date().toISOString()
      });

      alert("¡Registro exitoso!");
     window.location.href = "Inicio de sesion.html"
      // window.location.href = "dashboard.html";

    } catch (error) {
      manejarErrorFirebase(error);
    }
  });

 
  const btnGoogle = document.getElementById("Googleboton");

  btnGoogle.addEventListener("click", async (e) => {
    e.preventDefault();

    try {
      const result = await signInWithPopup(auth, googleProvider);
      const user = result.user;

      
      const userRef = ref(db, "usuarios/" + user.uid);
      const snapshot = await get(userRef);

      if (!snapshot.exists()) {
        await set(userRef, {
          nombre: user.displayName || "",
          correo: user.email,
          dui: "",
          Registro: "",
          giro: "",
          telefono: user.phoneNumber || "",
          metodoRegistro: "google",
          createdAt: new Date().toISOString()
        });

        alert("¡Cuenta creada con Google! Completa tu DUI y teléfono.");
      } else {
        alert("¡Bienvenido de nuevo!");
        window.location.href = "index.html"
        // window.location.href = "Completacion.html si lo requiere
      }

    } catch (error) {
      manejarErrorFirebase(error);
    }
  });

  
  function manejarErrorFirebase(error) {
    console.error(error.code, error.message);

    const mensajes = {
      "auth/email-already-in-use": "Este correo ya está registrado",
      "auth/invalid-email": "El correo no es válido",
      "auth/weak-password": "La contraseña es muy débil"
    };

     Notiflix.Notify.failure(mensajes[error.code] || "Ocurrió un error: " + error.message);
  }
</script>








</script>

</body>
</html>
