    :root {

    .header-tag {

      font-size: 0.85rem;
      font-weight: 600;

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      background: var(--white);
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
      position: relative;
    }

    .viewer-wrapper {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      user-select: none;
    }

    .vehicle-img {
      width: 100%;
      height: auto;
      display: block;
    }

    .lines-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .line-path {
      fill: none;
      stroke: var(--accent-red);
      stroke-width: 2;
      stroke-dasharray: 4, 4;
      animation: dash 30s linear infinite;
    }

    .point-origin {
      fill: var(--accent-red);
      stroke: var(--white);
      stroke-width: 2;
    }

    .hotspot-tag {
      position: absolute;
      transform: translate(-50%, -50%);
      background: var(--white);
      border: 1px solid rgba(19, 64, 116, 0.15);
      border-left: 4px solid var(--accent-red);
      padding: 0.5rem 0.9rem;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .hotspot-tag:hover {
      background: var(--primary-blue);
      color: var(--white);
      transform: translate(-50%, -53%);
      box-shadow: 0 6px 20px rgba(11, 37, 69, 0.25);
    }

    .hotspot-tag span {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .hotspot-tag::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--accent-red);
      border-radius: 50%;
    }

    .info-card {
      margin-top: 2rem;
      background: #f1f5f9;
      border-radius: 8px;
      padding: 1rem 1.5rem;
      border-left: 4px solid var(--secondary-blue);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .info-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary-blue);
    }

    .info-desc {
      font-size: 0.85rem;

    }

    .TarjetasC {

        stroke-dashoffset: -1000;

        <script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, query, orderByChild, equalTo, get, push, set} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
    apiKey: "AIzaSyCN-IWtXu98vNOiCA9mZ6dAmksJTK2lRDA",
    authDomain: "sparepartsq-f5f03.firebaseapp.com",
    databaseURL: "https://sparepartsq-f5f03-default-rtdb.firebaseio.com",
    projectId: "sparepartsq-f5f03",
    storageBucket: "sparepartsq-f5f03.firebasestorage.app",
    messagingSenderId: "148056463900",
    appId: "1:148056463900:web:84c7a729ae6b2ba2031dd9",
    measurementId: "G-XB8Z574X6M"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);



const tags = document.querySelectorAll('.hotspot-tag');
const infoTitle = document.getElementById('infoTitle');
const infoDesc = document.getElementById('infoDesc');
const catalogSection = document.getElementById('SeccionCatalogo');
const catalogHeading = document.getElementById('Ctitulo');
const catalogGrid = document.getElementById('contenedor');

const repuestosRef = ref(db, "Repuestos"); 


tags.forEach(tag => {
  tag.addEventListener('mouseenter', () => {
    if (!tag.classList.contains('active')) {
      infoTitle.innerText = tag.dataset.title;
      infoDesc.innerText = tag.dataset.desc;
    }
  });

  tag.addEventListener('click', () => {
    tags.forEach(t => t.classList.remove('active'));
    tag.classList.add('active');

    infoTitle.innerText = tag.dataset.title;
    infoDesc.innerText = tag.dataset.desc;

    catalogSection.style.display = 'block';
    catalogHeading.innerText = `Productos disponibles para: ${tag.dataset.title}`;


    mostrarCatalogo(tag);
  });
});

function mostrarCatalogo(tag) {
  catalogGrid.innerHTML = "";

  get(repuestosRef).then((snapshot) => {
    if (!snapshot.exists()) {
      catalogGrid.innerHTML = "<p>No hay productos disponibles</p>";
      return;
    }

    snapshot.forEach((childSnapshot) => {
      const repuesto = childSnapshot.val();
      const clave = childSnapshot.key;

     
      if (repuesto.tag == tag.dataset.title && repuesto.Model == "Frontier"){

      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <div class="telefono tamano" style="border: 2px solid #e2e4e9; height: 135px; border-radius: 5px; background: white; ">
          <img src="${repuesto.imagen}" height="124px" style="border-radius: 10px;" class="img2" alt="">
          <div class="elementos2" style="font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 500; width: 300px;">
            <div style="font-size: larger;">${repuesto.NombredelR}</div>
            <div style="font-size: smaller; color: #0B2545;">${repuesto.ModelEx || ''}</div>
            <div style="font-size: small;">En Existencia: ${repuesto.Existencias}</div>
          </div>
          <div class="texto2" style="font-weight: bolder; font-size: x-large; color: #D90429; width: 40px;">$${repuesto.Precio}</div>
          <button type="button" class="botones2" data-key="${clave}"
            style="background: #0B2545; color: white; font-weight: bold; padding: 5px 25px; border-radius: 5px; border: none;">
            Añadir
          </button>
        </div>
      `;
      catalogGrid.appendChild(card);
    }});


   
    catalogGrid.querySelectorAll('.botones2').forEach(btn => {
      btn.addEventListener('click', () => {
        agregarAlCarrito(btn.dataset.key);
      });
    });
  });
}

    let toastbox = document.getElementById('toastbox');

window.notificacion = function(msg) {
  const toastbox = document.getElementById('toastbox');

  if (!toastbox) {
    console.error('No se encontró #toastbox');
    alert(msg);
    return;
  }

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  toastbox.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.4s';
    setTimeout(() => toast.remove(), 400);
  }, 3500);
};

   

  async function agregarAlCarrito(clave) {


     const usuario = auth.currentUser;

  
    if (!usuario) {
        alert("Debes iniciar sesión para añadir productos al carrito");
        return;
    }


    const uid = usuario.uid;




    const snap = await get(ref(db, `Repuestos/${clave}`));

    if (!snap.exists()) {
      alert("Este repuesto ya no está disponible");
      return;
    }

    const producto = snap.val();

    const item = {
      nombre: producto.NombredelR,
      codigo: clave,
      auto: producto.Auto,
      modelo: producto.Model,
      year: producto.year,
      precio: parseFloat(producto.Precio),
      cantidad: 1,
    imagen: producto.imagen,
      agregadoEn: Date.now()
    };

    const nuevoItemRef = push(ref(db,`carrito/${uid}`));
    set(nuevoItemRef, item)
      .then(() => {
        const mensaje = `"${item.nombre}" (${clave}) enviado a cotizar`;
      notificacion(mensaje);
      })
      .catch((error) => {console.error("Error al añadir:", error);
      notificacion("Error al añadir el producto al carrito");});
  }


  

          onAuthStateChanged(auth,(user) => {

        if (user){
            inicio.classList.add("logeado");
            inicio.innerHTML = "Cerrar Sesion"
        } else
        inicio.classList.remove("logeado");

    });
</script>
