<!DOCTYPE html>
<html>
<head>

	<style>
    body{
            margin: 0;
      background-color: #F7F8F9;

    .formulario{
 
  height: 100%;
  display: flex;
  justify-content: center;

}

#form{
  
  width: 500px;
  height: 1035px;
  border-radius: 20px;
  background-color: white;
  display: flex;
  flex-direction: column;
  padding: 32px 48px;
  align-items: center;
  justify-content: center;
}

h2{
  
  font-size: 24px;
  color: black;
  margin-bottom: 16px;
}

.input-contenedor{
 
  width:100%;
  display: flex;
  flex-direction: column;
  gap:12px;
  margin-bottom: 16px;
}

.input-contenedor input{
  border: 1px solid #D0D0D0;
  height: 40px ;
  padding: 8px 16px;
  outline: none;
  border-radius: 7px;

}

.help-link{
  
  font-size: 13px;
  width: 100%;
  text-decoration: none;
  color: black;
  margin-bottom: 20px;
}

#form .botoniniciarsesion{
  width: 100%;
  height: 45px;
  border-radius: 8px;
  background-color: #1F7EC0;
  font-weight: 600;
  color: white;
  font-family: 'Barlow', Arial, sans-serif ;
  cursor: pointer;
  font-size: 14px;
  margin-bottom: 18px;
  border: none;
}

.texto-separador{
  
  display: flex;
  align-items: center;
  justify-content: center;
  color: black ;
  font-size: 14px;
  margin-top: 2px;
  margin-bottom: 10px;

}

.texto-separador::before
.texto-separador::after{
  border-bottom: 2px solid black;
  width: 16px;
  margin: 0 0.6rem;
}

.autenticacion-opciones{
  
  display: flex;
  width: 100%;
  justify-content: center;
  margin-bottom: 19px;
  border-radius: 4px;
  background-color: white;
}

.autenticacion-opciones span{
  font-weight: 600;
  font-size: 14px;
}

.autenticacion-opciones{
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  padding: 16px;
  border: 1px solid gray;
  cursor: pointer;
}

.formulario .autenticacion-opciones img{
  width: 18px;


}
	</style>
</head>
<body>

        <div class="formulario">
          <div id="form">
          <h2>Repuesto a BD</h2>
          <div class="input-contenedor">
<label> Repuesto (nombre, ej: Amortiguador Delantero)</label> <input id="Namebox" type="text">
<label> Auto </label> <input id="Namebox2" type="text">
<label> Año </label> <input id="Namebox3" type="text">
<label> Modelo </label> <input id="Namebox4" type="text">
<label> Precio </label> <input id="Namebox5" type="text">
<label> ID (inventado)</label> <input id="Namebox6" type="text">
<label> imagen (link preferiblemente que sea imagen cuadrada del repuesto) </label> <input id="Namebox7" type="text">
<label> Existencias (numero) </label> <input id="Namebox8" type="text">
<label> Tag </label> <input id="Namebox9" type="text">

<button id="BTNnsert" class="botoniniciarsesion" type="submit">Insertar</button>
</div> <br><br>

</div>
</div>







	<script  type="module">

  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
   import Notiflix from 'https://cdn.jsdelivr.net/npm/notiflix@3/+esm';
  
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  // For Firebase JS SDK v7.20.0 and later, measurementId is optional
  const firebaseConfig = {
    apiKey: "AIzaSyCN-IWtXu98vNOiCA9mZ6dAmksJTK2lRDA",
    authDomain: "sparepartsq-f5f03.firebaseapp.com",
    databaseURL: "https://sparepartsq-f5f03-default-rtdb.firebaseio.com",

    messagingSenderId: "148056463900",
    appId: "1:148056463900:web:84c7a729ae6b2ba2031dd9",
    measurementId: "G-XB8Z574X6M"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  

  import {getDatabase, ref, set, child, update, remove} from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

  const db = getDatabase();

  var namebox = document.getElementById("Namebox");
  var namebox2 = document.getElementById("Namebox2");
  var namebox3 = document.getElementById("Namebox3");
  var namebox4 = document.getElementById("Namebox4");
  var namebox5 = document.getElementById("Namebox5");
  var namebox6 = document.getElementById("Namebox6");
  var namebox7 = document.getElementById("Namebox7");
  var namebox8 = document.getElementById("Namebox8");
  var namebox9 = document.getElementById("Namebox9");

  function InsertData() {
  	set(ref(db, "Repuestos/"+ Namebox6.value),{
  		NombredelR: Namebox.value,
  		Auto: Namebox2.value,
  		year: Namebox3.value,
  		Model: Namebox4.value,
  		Precio: Namebox5.value,
  		ModelEx: Namebox6.value,
      imagen: Namebox7.value,
      Existencias: Namebox8.value,
      tag: Namebox9.value,
  	})
  	.then(()=>{
  		Notiflix.Notify.success("Data cargada correctamente");
  	})
  	.catch((error)=>{
  		Notiflix.Notify.warning("Hubo un error");
  	})
  }

  BTNnsert.addEventListener('click', InsertData);




</script>

</body>
